<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>سطح الطيور أونلاين</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1b263b;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      color: #fff;
      touch-action: none;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* شريط علوي صغير ومرتب لا يحجب الرؤية */
    .top-bar {
      position: fixed;
      top: 8px;
      left: 8px;
      right: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      z-index: 20;
      pointer-events: none;
    }

    .hud-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      pointer-events: auto;
    }

    .badge {
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 12px;
      line-height: 1.3;
      backdrop-filter: blur(4px);
    }

    .btn {
      background: rgba(30, 41, 59, 0.88);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.08s ease, background 0.15s ease;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn.primary {
      background: rgba(2, 132, 199, 0.9);
      border-color: rgba(125, 211, 252, 0.45);
    }

    .btn.success {
      background: rgba(22, 163, 74, 0.9);
      border-color: rgba(134, 239, 172, 0.45);
    }

    /* أزرار التحكم السفلية الصغيرة (بدون تغطية الشاشة ومع دعم اللمس المتعدد) */
    .controls-layer {
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 20;
      pointer-events: none;
    }

    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 42px);
      grid-template-rows: repeat(3, 42px);
      gap: 4px;
      pointer-events: auto;
    }

    .pad-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(15, 23, 42, 0.72);
      color: #fff;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .pad-btn.active {
      background: rgba(56, 189, 248, 0.85);
      color: #0f172a;
      font-weight: bold;
    }

    .action-cluster {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
      pointer-events: auto;
    }

    .action-btn {
      padding: 7px 12px;
      font-size: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(15, 23, 42, 0.82);
      color: #fff;
      cursor: pointer;
      touch-action: none;
    }

    /* نافذة الدردشة القابلة للفتح والإغلاق */
    .chat-box {
      position: fixed;
      bottom: 62px;
      right: 10px;
      width: min(270px, calc(100vw - 20px));
      max-height: 220px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 6px;
      z-index: 30;
    }

    .chat-box.open {
      display: flex;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 140px;
    }

    .chat-msg {
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 6px;
      border-radius: 6px;
      word-break: break-word;
    }

    .chat-form {
      display: flex;
      gap: 4px;
    }

    .chat-input {
      flex: 1;
      min-width: 0;
      padding: 5px 7px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(30, 41, 59, 0.95);
      color: #fff;
      font-size: 12px;
    }

    /* النوافذ الجانبية الخفيفة (السوق / اللاعبون / تفاصيل الطيور) */
    .panel {
      position: fixed;
      top: 46px;
      left: 8px;
      width: min(310px, calc(100vw - 16px));
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.93);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 10px;
      display: none;
      z-index: 25;
      font-size: 12px;
    }

    .panel.open {
      display: block;
    }

    .card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9px;
      padding: 8px;
      margin-bottom: 8px;
    }

    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .bird-meta {
      margin-top: 5px;
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.45;
    }

    .toast {
      position: fixed;
      top: 48px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(2, 132, 199, 0.94);
      color: #fff;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      z-index: 40;
      display: none;
      white-space: nowrap;
    }

    .visit-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid rgba(125, 211, 252, 0.5);
      border-radius: 12px;
      padding: 14px;
      z-index: 45;
      display: none;
      width: min(280px, 90vw);
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="toast" class="toast"></div>

  <!-- إشعار طلب زيارة سطح -->
  <div id="visitModal" class="visit-modal">
    <div id="visitText" style="margin-bottom: 10px; font-size: 13px;"></div>
    <div style="display: flex; gap: 8px; justify-content: center;">
      <button id="acceptVisitBtn" class="btn success">قبول</button>
      <button id="declineVisitBtn" class="btn">رفض</button>
    </div>
  </div>

  <!-- شريط علوي مختصر -->
  <div class="top-bar">
    <div class="hud-group">
      <div class="badge">الرصيد: <strong id="balanceVal">1000</strong></div>
      <div class="badge">السطح: <strong id="rooftopOwnerVal">سطحي</strong></div>
      <button id="returnHomeBtn" class="btn primary" style="display: none;">رجوع لسطحي</button>
    </div>

    <div class="hud-group">
      <button id="toggleMarketBtn" class="btn">السوق</button>
      <button id="toggleInfoBtn" class="btn">الطيور</button>
      <button id="togglePlayersBtn" class="btn">أونلاين</button>
      <button id="toggleChatBtn" class="btn primary">الدردشة</button>
    </div>
  </div>

  <!-- لوحة السوق (البنية ثابتة كما هي) -->
  <div id="marketPanel" class="panel">
    <div style="font-weight: bold; margin-bottom: 8px;">سوق الطيور</div>
    <div id="marketList"></div>
  </div>

  <!-- لوحة معلومات وتفاصيل كل طير -->
  <div id="infoPanel" class="panel">
    <div style="font-weight: bold; margin-bottom: 8px;">معلومات وتفاصيل الطيور</div>
    <div id="birdInfoList"></div>
  </div>

  <!-- لوحة اللاعبين الأونلاين وزيارة الأسطح -->
  <div id="playersPanel" class="panel">
    <div style="font-weight: bold; margin-bottom: 8px;">اللاعبون المتصلون</div>
    <div id="playersList"></div>
  </div>

  <!-- نافذة الدردشة (فتح / إغلاق) -->
  <div id="chatBox" class="chat-box">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 12px; font-weight: bold;">الدردشة</span>
      <button id="closeChatBtn" class="btn" style="padding: 2px 7px; font-size: 11px;">إغلاق</button>
    </div>
    <div id="chatMessages" class="chat-messages"></div>
    <form id="chatForm" class="chat-form">
      <input id="chatInput" class="chat-input" type="text" maxlength="180" placeholder="اكتب رسالة..." autocomplete="off" />
      <button type="submit" class="btn primary" style="padding: 5px 8px;">إرسال</button>
    </form>
  </div>

  <!-- أزرار الحركة والإقلاع/النزول مع دعم اللمس المتعدد -->
  <div class="controls-layer">
    <div class="dpad" id="dpad">
      <div></div>
      <button class="pad-btn" data-dir="up">▲</button>
      <div></div>
      <button class="pad-btn" data-dir="left">◀</button>
      <div class="pad-btn" style="opacity:0.25; pointer-events:none;">•</div>
      <button class="pad-btn" data-dir="right">▶</button>
      <div></div>
      <button class="pad-btn" data-dir="down">▼</button>
      <div></div>
    </div>

    <div class="action-cluster">
      <button id="flightBtn" class="action-btn">إقلاع / نزول</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // حالة العميل
    let myId = null;
    let myBalance = 1000;
    let worldPlayers = [];
    let marketBirds = [];
    let pendingVisitRequestId = null;

    // عناصر الواجهة
    const balanceVal = document.getElementById("balanceVal");
    const rooftopOwnerVal = document.getElementById("rooftopOwnerVal");
    const returnHomeBtn = document.getElementById("returnHomeBtn");
    const toastEl = document.getElementById("toast");

    const marketPanel = document.getElementById("marketPanel");
    const infoPanel = document.getElementById("infoPanel");
    const playersPanel = document.getElementById("playersPanel");
    const chatBox = document.getElementById("chatBox");

    const marketList = document.getElementById("marketList");
    const birdInfoList = document.getElementById("birdInfoList");
    const playersList = document.getElementById("playersList");
    const chatMessagesEl = document.getElementById("chatMessages");
    const chatForm = document.getElementById("chatForm");
    const chatInput = document.getElementById("chatInput");

    const visitModal = document.getElementById("visitModal");
    const visitText = document.getElementById("visitText");
    const acceptVisitBtn = document.getElementById("acceptVisitBtn");
    const declineVisitBtn = document.getElementById("declineVisitBtn");
    const flightBtn = document.getElementById("flightBtn");

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.style.display = "block";
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => {
        toastEl.style.display = "none";
      }, 2200);
    }

    function closeAllSidePanels(exceptEl = null) {
      for (const p of [marketPanel, infoPanel, playersPanel]) {
        if (p !== exceptEl) p.classList.remove("open");
      }
    }

    document.getElementById("toggleMarketBtn").addEventListener("click", () => {
      closeAllSidePanels(marketPanel);
      marketPanel.classList.toggle("open");
      renderMarket();
    });

    document.getElementById("toggleInfoBtn").addEventListener("click", () => {
      closeAllSidePanels(infoPanel);
      infoPanel.classList.toggle("open");
      renderBirdDetails();
    });

    document.getElementById("togglePlayersBtn").addEventListener("click", () => {
      closeAllSidePanels(playersPanel);
      playersPanel.classList.toggle("open");
      renderPlayersList();
    });

    document.getElementById("toggleChatBtn").addEventListener("click", () => {
      chatBox.classList.toggle("open");
    });

    document.getElementById("closeChatBtn").addEventListener("click", () => {
      chatBox.classList.remove("open");
    });

    returnHomeBtn.addEventListener("click", () => {
      sendWs({ type: "return_home" });
    });

    acceptVisitBtn.addEventListener("click", () => {
      if (pendingVisitRequestId) {
        sendWs({ type: "respond_visit", requestId: pendingVisitRequestId, accept: true });
        pendingVisitRequestId = null;
      }
      visitModal.style.display = "none";
    });

    declineVisitBtn.addEventListener("click", () => {
      if (pendingVisitRequestId) {
        sendWs({ type: "respond_visit", requestId: pendingVisitRequestId, accept: false });
        pendingVisitRequestId = null;
      }
      visitModal.style.display = "none";
    });

    // منع كلج التكرار السريع على زر الإقلاع / النزول من جهة العميل أيضاً
    let flightClickLock = false;
    flightBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      if (flightClickLock) return;
      flightClickLock = true;
      sendWs({ type: "toggle_flight" });
      setTimeout(() => {
        flightClickLock = false;
      }, 500);
    });

    // معالجة اللمس المتعدد (Multi-Touch) لكل إصبع بشكل مستقل
    // بحيث لا يتوقف اللاعب عن المشي عند استخدام عدة أصابع
    const activePointers = new Map(); // pointerId -> dir ("up"|"down"|"left"|"right")
    const keysPressed = new Set();

    function refreshPadVisuals() {
      const activeDirs = new Set(activePointers.values());
      document.querySelectorAll(".pad-btn[data-dir]").forEach((btn) => {
        const d = btn.getAttribute("data-dir");
        const isOn = activeDirs.has(d) ||
          (d === "up" && (keysPressed.has("ArrowUp") || keysPressed.has("KeyW"))) ||
          (d === "down" && (keysPressed.has("ArrowDown") || keysPressed.has("KeyS"))) ||
          (d === "left" && (keysPressed.has("ArrowLeft") || keysPressed.has("KeyA"))) ||
          (d === "right" && (keysPressed.has("ArrowRight") || keysPressed.has("KeyD")));
        btn.classList.toggle("active", isOn);
      });
    }

    document.querySelectorAll(".pad-btn[data-dir]").forEach((btn) => {
      const dir = btn.getAttribute("data-dir");

      btn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        btn.setPointerCapture(e.pointerId);
        activePointers.set(e.pointerId, dir);
        refreshPadVisuals();
      });

      const releasePointer = (e) => {
        if (activePointers.has(e.pointerId)) {
          activePointers.delete(e.pointerId);
          refreshPadVisuals();
        }
      };

      btn.addEventListener("pointerup", releasePointer);
      btn.addEventListener("pointercancel", releasePointer);
      btn.addEventListener("lostpointercapture", releasePointer);
    });

    window.addEventListener("keydown", (e) => {
      if (document.activeElement === chatInput) return;
      keysPressed.add(e.code);
      refreshPadVisuals();
    });

    window.addEventListener("keyup", (e) => {
      keysPressed.delete(e.code);
      refreshPadVisuals();
    });

    function computeMoveVector() {
      let dx = 0;
      let dy = 0;

      const dirs = new Set(activePointers.values());
      if (keysPressed.has("ArrowLeft") || keysPressed.has("KeyA")) dirs.add("left");
      if (keysPressed.has("ArrowRight") || keysPressed.has("KeyD")) dirs.add("right");
      if (keysPressed.has("ArrowUp") || keysPressed.has("KeyW")) dirs.add("up");
      if (keysPressed.has("ArrowDown") || keysPressed.has("KeyS")) dirs.add("down");

      if (dirs.has("left")) dx -= 1;
      if (dirs.has("right")) dx += 1;
      if (dirs.has("up")) dy -= 1;
      if (dirs.has("down")) dy += 1;

      return { dx, dy };
    }

    // اتصال WebSocket
    const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${wsProtocol}//${location.host}/ws`);
    let wsReady = false;

    function sendWs(payload) {
      if (wsReady && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(payload));
      }
    }

    ws.addEventListener("open", () => {
      wsReady = true;
    });

    ws.addEventListener("message", (ev) => {
      let msg;
      try {
        msg = JSON.parse(ev.data);
      } catch (_) {
        return;
      }

      if (msg.type === "welcome") {
        myId = msg.id;
        myBalance = msg.balance;
        marketBirds = msg.market || [];
        balanceVal.textContent = myBalance;
        renderMarket();
        renderBirdDetails();
      } else if (msg.type === "self_info") {
        myBalance = msg.balance;
        balanceVal.textContent = myBalance;
      } else if (msg.type === "toast") {
        showToast(msg.text);
      } else if (msg.type === "visit_request") {
        pendingVisitRequestId = msg.requestId;
        visitText.textContent = `يرغب اللاعب (${msg.fromName}) بزيارة سطحك. هل توافق؟`;
        visitModal.style.display = "block";
      } else if (msg.type === "visit_accepted") {
        showToast(`تم قبول الزيارة! أنت الآن على سطح ${msg.hostName}`);
      } else if (msg.type === "world_state") {
        worldPlayers = msg.players || [];
        if (msg.market && msg.market.length) marketBirds = msg.market;

        const me = worldPlayers.find((p) => p.id === myId);
        if (me) {
          myBalance = me.balance;
          balanceVal.textContent = myBalance;

          const activeOwner = worldPlayers.find((p) => p.id === me.viewingOwnerId) || me;
          const isVisiting = activeOwner.id !== me.id;
          rooftopOwnerVal.textContent = isVisiting ? `سطح ${activeOwner.name}` : "سطحي";
          returnHomeBtn.style.display = isVisiting ? "inline-block" : "none";
        }

        renderChat(msg.chat || []);
        if (playersPanel.classList.contains("open")) renderPlayersList();
      }
    });

    function renderMarket() {
      marketList.innerHTML = "";
      for (const bird of marketBirds) {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="card-row">
            <div>
              <strong>${bird.name}</strong>
              <div style="color:#fbbf24; font-size:11px;">السعر: ${bird.price}</div>
            </div>
            <button class="btn success" data-buy="${bird.id}">شراء</button>
          </div>
        `;
        div.querySelector("[data-buy]").addEventListener("click", () => {
          sendWs({ type: "buy_bird", speciesId: bird.id });
        });
        marketList.appendChild(div);
      }
    }

    function renderBirdDetails() {
      birdInfoList.innerHTML = "";
      for (const bird of marketBirds) {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="card-row">
            <strong style="color:${bird.color};">${bird.name}</strong>
            <span style="color:#fbbf24;">${bird.price}</span>
          </div>
          <div class="bird-meta">
            <div>• السرعة: ${bird.speed} | أقصى ارتفاع: ${bird.altitude} | الرشاقة: ${Math.round(bird.agility * 100)}%</div>
            <div>• ${bird.description}</div>
          </div>
        `;
        birdInfoList.appendChild(div);
      }
    }

    function renderPlayersList() {
      playersList.innerHTML = "";
      const others = worldPlayers.filter((p) => p.id !== myId);
      if (others.length === 0) {
        playersList.innerHTML = `<div style="color:#94a3b8;">لا يوجد لاعبون آخرون متصلون حالياً.</div>`;
        return;
      }
      for (const p of others) {
        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="card-row">
            <div>
              <strong>${p.name}</strong>
              <div style="color:#94a3b8; font-size:11px;">الطيور: ${p.birds.length}</div>
            </div>
            <button class="btn primary" data-visit="${p.id}">طلب زيارة</button>
          </div>
        `;
        div.querySelector("[data-visit]").addEventListener("click", () => {
          sendWs({ type: "request_visit", targetPlayerId: p.id });
          playersPanel.classList.remove("open");
        });
        playersList.appendChild(div);
      }
    }

    function renderChat(messages) {
      const atBottom = chatMessagesEl.scrollTop + chatMessagesEl.clientHeight >= chatMessagesEl.scrollHeight - 10;
      chatMessagesEl.innerHTML = "";
      for (const m of messages) {
        const item = document.createElement("div");
        item.className = "chat-msg";
        item.innerHTML = `<strong style="color:#7dd3fc;">${escapeHtml(m.senderName)}:</strong> ${escapeHtml(m.text)} <span style="color:#64748b; font-size:10px;">${escapeHtml(m.time || "")}</span>`;
        chatMessagesEl.appendChild(item);
      }
      if (atBottom) {
        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;
      sendWs({ type: "chat", text });
      chatInput.value = "";
    });

    // رسم السطح الكامل، القفص، الطيور، اللاعبين، والطيران في الجو
    function drawScene() {
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      // سماء الجو
      const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
      skyGrad.addColorStop(0, "#0ea5e9");
      skyGrad.addColorStop(0.6, "#bae6fd");
      skyGrad.addColorStop(0.61, "#1e293b");
      skyGrad.addColorStop(1, "#0f172a");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, w, h);

      // سحب خفيفة في الجو
      ctx.fillStyle = "rgba(255, 255, 255, 0.45)";
      const t = Date.now() * 0.02;
      for (let i = 0; i < 4; i++) {
        const cx = ((t + i * 260) % (w + 180)) - 90;
        const cy = 65 + i * 32;
        ctx.beginPath();
        ctx.arc(cx, cy, 22, 0, Math.PI * 2);
        ctx.arc(cx + 18, cy + 4, 18, 0, Math.PI * 2);
        ctx.arc(cx - 18, cy + 5, 16, 0, Math.PI * 2);
        ctx.fill();
      }

      // مقياس مناسب لتوسيط مشهد السطح (900x520) على مختلف الشاشات
      const baseW = 900;
      const baseH = 520;
      const scale = Math.min(w / baseW, h / baseH);
      const offsetX = (w - baseW * scale) / 2;
      const offsetY = (h - baseH * scale) / 2;

      ctx.save();
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);

      const me = worldPlayers.find((p) => p.id === myId);
      const activeOwner = (me && worldPlayers.find((p) => p.id === me.viewingOwnerId)) || me;

      // جسم البناية تحت السطح
      ctx.fillStyle = "#334155";
      ctx.fillRect(90, 445, 720, 75);

      // أرضية السطح
      ctx.fillStyle = "#cbd5e1";
      ctx.fillRect(90, 285, 720, 175);
      ctx.strokeStyle = "#64748b";
      ctx.lineWidth = 4;
      ctx.strokeRect(90, 285, 720, 175);

      // سور السطح
      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 5;
      ctx.strokeRect(95, 280, 710, 180);

      // القفص على السطح
      ctx.save();
      ctx.fillStyle = "rgba(255, 255, 255, 0.14)";
      ctx.strokeStyle = "#475569";
      ctx.lineWidth = 3;
      ctx.fillRect(115, 235, 135, 95);
      ctx.strokeRect(115, 235, 135, 95);

      // قضبان القفص
      ctx.lineWidth = 1.5;
      for (let gx = 127; gx < 250; gx += 14) {
        ctx.beginPath();
        ctx.moveTo(gx, 235);
        ctx.lineTo(gx, 330);
        ctx.stroke();
      }
      ctx.fillStyle = "#1e293b";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("القفص", 182, 228);
      ctx.restore();

      // اللاعبون المتواجدون في نفس السطح
      const visiblePlayers = worldPlayers.filter(
        (p) => activeOwner && p.viewingOwnerId === activeOwner.id
      );

      for (const p of visiblePlayers) {
        ctx.save();
        // ظل اللاعب
        ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
        ctx.beginPath();
        ctx.ellipse(p.x, p.y + 18, 16, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // جسم اللاعب
        ctx.fillStyle = p.id === myId ? "#2563eb" : "#dc2626";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);
        ctx.fill();

        // رأس اللاعب
        ctx.fillStyle = "#fde68a";
        ctx.beginPath();
        ctx.arc(p.x + p.facing * 4, p.y - 18, 9, 0, Math.PI * 2);
        ctx.fill();

        // اسم اللاعب
        ctx.fillStyle = "#0f172a";
        ctx.font = "bold 12px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(p.name, p.x, p.y - 32);
        ctx.restore();
      }

      // الطيور (أرضية + طائرة في الجو)
      const birdsToDraw = activeOwner ? activeOwner.birds : [];
      for (const b of birdsToDraw) {
        const spec = marketBirds.find((m) => m.id === b.speciesId) || {
          color: "#e2e8f0",
          accent: "#334155"
        };

        const alt = b.z || 0;
        const drawX = b.x;
        const drawY = b.y - alt;

        ctx.save();

        // ظل الطير على الأرض
        ctx.fillStyle = "rgba(15, 23, 42, 0.22)";
        ctx.beginPath();
        ctx.ellipse(b.x, b.y + 8, Math.max(5, 11 - alt * 0.02), Math.max(2.5, 5 - alt * 0.01), 0, 0, Math.PI * 2);
        ctx.fill();

        // رفرفة الجناح عند الطيران في الجو
        const flap = b.state === "flying" ? Math.sin(Date.now() * 0.025 + b.x) * 7 : 0;

        // جناح الطير
        ctx.fillStyle = spec.accent;
        ctx.beginPath();
        ctx.ellipse(drawX, drawY - 2 + flap * 0.3, 9, Math.max(3, 6 + flap * 0.4), -0.2, 0, Math.PI * 2);
        ctx.fill();

        // جسم الطير
        ctx.fillStyle = spec.color;
        ctx.beginPath();
        ctx.ellipse(drawX, drawY, 10, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        // رأس الطير
        ctx.beginPath();
        ctx.arc(drawX + 8, drawY - 4, 5, 0, Math.PI * 2);
        ctx.fill();

        // إظهار اسم الطير فقط عندما يكون على الأرض وليس في الجو
        if (b.state === "ground" && alt < 2) {
          ctx.fillStyle = "#0f172a";
          ctx.font = "bold 11px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(b.name, drawX, drawY - 14);
        }

        ctx.restore();
      }

      ctx.restore();
    }

    // إرسال اتجاه الحركة بشكل منتظم
    setInterval(() => {
      const vec = computeMoveVector();
      sendWs({ type: "move", dx: vec.dx, dy: vec.dy });
    }, 50);

    function loop() {
      drawScene();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
