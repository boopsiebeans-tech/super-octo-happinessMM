<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PIGEON KINGDOM ONLINE - مملكة الحمام أونلاين</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #87b5d6;
      font-family: 'Cairo', sans-serif;
      touch-action: none;
    }

    #game-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      background: #87b5d6;
    }

    .hud-top {
      position: fixed;
      top: 5px;
      left: 5px;
      right: 5px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 5px;
      z-index: 120;
      pointer-events: none;
    }

    .brand-badge {
      background: linear-gradient(155deg, rgba(14, 14, 18, 0.92), rgba(55, 10, 14, 0.92));
      border: 1px solid #dc2626;
      border-radius: 8px;
      padding: 3px 7px;
      color: #ffffff;
      pointer-events: auto;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 10px;
      font-weight: 900;
      color: #f87171;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 8.5px;
      font-weight: 700;
      color: #f3f4f6;
      line-height: 1.15;
    }

    .hud-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 3px;
      max-width: 75%;
      pointer-events: auto;
    }

    .hud-pill {
      background: rgba(14, 14, 18, 0.88);
      border: 1px solid rgba(220, 38, 38, 0.65);
      color: #f9fafb;
      font-size: 8.5px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 6px;
      white-space: nowrap;
      line-height: 1.2;
    }

    .hud-pill span {
      color: #fca5a5;
      font-weight: 800;
    }

    .hud-pill.gold span {
      color: #facc15;
    }

    .hud-btn {
      background: linear-gradient(155deg, #16161c 0%, #3b0d11 70%, #991b1b 100%);
      border: 1px solid #dc2626;
      color: #ffffff;
      font-family: 'Cairo', sans-serif;
      font-size: 8.5px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      white-space: nowrap;
      cursor: pointer;
      line-height: 1.2;
    }

    .hud-btn.market-btn {
      background: linear-gradient(155deg, #78350f 0%, #b45309 70%, #dc2626 100%);
      border-color: #fbbf24;
      color: #fef3c7;
    }

    #chat-toggle-btn {
      position: fixed;
      top: 50px;
      left: 6px;
      z-index: 130;
      background: rgba(14, 14, 18, 0.9);
      border: 1px solid #38bdf8;
      color: #e0f2fe;
      font-family: 'Cairo', sans-serif;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 7px;
      cursor: pointer;
    }

    #online-chat-box {
      position: fixed;
      top: 74px;
      left: 6px;
      width: 205px;
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 135;
      background: rgba(14, 14, 18, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.7);
      border-radius: 8px;
      padding: 5px;
    }

    #chat-messages {
      max-height: 70px;
      overflow-y: auto;
      font-size: 8.5px;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .chat-row {
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 5px;
      border-radius: 4px;
    }

    .visit-mini-btn {
      align-self: flex-start;
      background: #0284c7;
      border: none;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 8px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
      cursor: pointer;
    }

    .chat-input-wrap {
      display: flex;
      gap: 3px;
    }

    #online-chat-input {
      flex: 1;
      min-width: 0;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      padding: 2px 5px;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 9px;
      outline: none;
    }

    #online-chat-send {
      background: #0284c7;
      border: none;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 5px;
      cursor: pointer;
    }

    #visit-prompt {
      position: fixed;
      top: 82px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.96);
      border: 1.5px solid #38bdf8;
      border-radius: 9px;
      padding: 5px 9px;
      z-index: 180;
      display: none;
      align-items: center;
      gap: 6px;
      color: #fff;
      font-size: 9.5px;
      font-weight: 800;
    }

    #toast-msg {
      position: fixed;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 15, 20, 0.94);
      border: 1px solid #facc15;
      color: #fef08a;
      font-size: 9.5px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 12px;
      z-index: 150;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      max-width: 88vw;
      text-align: center;
    }

    #held-bird-bar {
      position: fixed;
      bottom: 108px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(14, 14, 18, 0.94);
      border: 1px solid #dc2626;
      border-radius: 9px;
      padding: 4px 7px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      z-index: 140;
      max-width: 94vw;
    }

    #held-bird-title {
      color: #fca5a5;
      font-size: 9px;
      font-weight: 800;
    }

    .held-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px;
    }

    .held-act-btn {
      background: linear-gradient(155deg, #1f1f27, #991b1b);
      border: 1px solid #f87171;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 8.5px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 5px;
      cursor: pointer;
    }

    #joystick-zone {
      position: fixed;
      left: 10px;
      bottom: 10px;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(20, 20, 24, 0.45) 0%, rgba(127, 29, 29, 0.48) 100%);
      border: 1.5px solid rgba(220, 38, 38, 0.8);
      z-index: 120;
      touch-action: none;
    }

    #joystick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 32px;
      height: 32px;
      margin-left: -16px;
      margin-top: -16px;
      border-radius: 50%;
      background: linear-gradient(145deg, #18181b 0%, #dc2626 100%);
      border: 1.5px solid #fca5a5;
      pointer-events: none;
    }

    .action-cluster {
      position: fixed;
      right: 6px;
      bottom: 8px;
      display: grid;
      grid-template-columns: repeat(2, minmax(66px, auto));
      gap: 3px;
      z-index: 120;
      pointer-events: auto;
      direction: rtl;
    }

    .act-btn {
      min-width: 66px;
      height: 24px;
      padding: 1px 5px;
      border-radius: 6px;
      background: linear-gradient(160deg, #111111 0%, #2b090c 60%, #b91c1c 100%);
      border: 1px solid #dc2626;
      color: #ffffff;
      font-family: 'Cairo', sans-serif;
      font-size: 8.5px;
      font-weight: 800;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .act-btn.feed-btn {
      background: linear-gradient(160deg, #141414 0%, #422006 60%, #b45309 100%);
      border-color: #f59e0b;
    }

    .act-btn.water-btn {
      background: linear-gradient(160deg, #0c192c 0%, #075985 60%, #0284c7 100%);
      border-color: #38bdf8;
    }

    .act-btn.grab-btn {
      background: linear-gradient(160deg, #111827 0%, #064e3b 60%, #059669 100%);
      border-color: #34d399;
    }

    .act-btn:active {
      transform: scale(0.95);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 8, 12, 0.84);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 10px;
      z-index: 220;
    }

    .market-card {
      width: 100%;
      max-width: 460px;
      max-height: 84vh;
      background: linear-gradient(165deg, #121217 0%, #26090c 100%);
      border: 1.5px solid #dc2626;
      border-radius: 13px;
      color: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .market-header {
      padding: 7px 11px;
      background: rgba(0, 0, 0, 0.45);
      border-bottom: 1px solid rgba(220, 38, 38, 0.5);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .market-title {
      font-size: 11.5px;
      font-weight: 900;
      color: #f87171;
    }

    .market-balance {
      font-size: 9.5px;
      font-weight: 800;
      color: #facc15;
    }

    .close-market {
      background: #991b1b;
      border: 1px solid #fca5a5;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    .market-tabs {
      display: flex;
      gap: 4px;
      padding: 5px 8px;
      background: rgba(0, 0, 0, 0.35);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      overflow-x: auto;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #e5e7eb;
      font-family: 'Cairo', sans-serif;
      font-size: 9px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #dc2626;
      border-color: #fca5a5;
      color: #fff;
    }

    .market-body {
      padding: 7px 9px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .shop-item {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 7px;
    }

    .shop-info h4 {
      font-size: 10px;
      font-weight: 800;
      color: #f9fafb;
    }

    .shop-info p {
      font-size: 8.5px;
      color: #d1d5db;
      margin-top: 2px;
    }

    .buy-btn {
      background: linear-gradient(155deg, #b45309, #dc2626);
      border: 1px solid #fbbf24;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 9px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 6px;
      white-space: nowrap;
      cursor: pointer;
    }

    .buy-btn.sell-btn {
      background: linear-gradient(155deg, #065f46, #059669);
      border-color: #6ee7b7;
    }

    .buy-btn.equip-btn {
      background: linear-gradient(155deg, #1d4ed8, #2563eb);
      border-color: #93c5fd;
    }

    .rename-input {
      width: 100%;
      padding: 6px 8px;
      border-radius: 7px;
      border: 1px solid #dc2626;
      background: #18181b;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      outline: none;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div class="hud-top">
    <div class="brand-badge">
      <div class="brand-title">PIGEON KINGDOM ONLINE</div>
      <div class="brand-sub" id="hud-skin-label">سطح #1 • مطيرجي بغدادي</div>
    </div>

    <div class="hud-pills">
      <div class="hud-pill">أونلاين: <span id="stat-online">1</span>/100</div>
      <div class="hud-pill gold">الرصيد: <span id="stat-coins">250</span> د.ع</div>
      <div class="hud-pill">السرب: <span id="stat-flying">0</span>/<span id="stat-total">12</span></div>
      <div class="hud-pill">علف: <span id="stat-feed">5</span> | ماي: <span id="stat-water">3</span></div>
      <div class="hud-pill">الباب: <span id="stat-door">مغلق</span></div>
      <button id="btn-visit-roof" class="hud-btn" type="button">زيارة سطح</button>
      <button id="btn-leaderboard" class="hud-btn" type="button">الترتيب</button>
      <button id="btn-market" class="hud-btn market-btn" type="button">السوق</button>
      <button id="btn-view" class="hud-btn" type="button">منظور: ثالث</button>
    </div>
  </div>

  <button id="chat-toggle-btn" type="button">الدردشة ▾</button>

  <div id="online-chat-box">
    <div id="chat-messages"></div>
    <div class="chat-input-wrap">
      <input id="online-chat-input" type="text" maxlength="80" placeholder="اكتب رسالة..." />
      <button id="online-chat-send" type="button">إرسال</button>
    </div>
  </div>

  <div id="visit-prompt">
    <span id="visit-prompt-text">طلب زيارة سطح</span>
    <button id="btn-visit-accept" class="buy-btn sell-btn" type="button">قبول</button>
    <button id="btn-visit-decline" class="buy-btn" type="button">رفض</button>
  </div>

  <div id="toast-msg"></div>

  <div id="held-bird-bar">
    <div id="held-bird-title">ماسك طير</div>
    <div class="held-actions">
      <button id="btn-put-ground" class="held-act-btn" type="button">حطّه بالكاع</button>
      <button id="btn-release-fly" class="held-act-btn" type="button">طيّره بالسماء</button>
      <button id="btn-tame-shoulder" class="held-act-btn" type="button">أليف عل جتف</button>
      <button id="btn-rename-bird" class="held-act-btn" type="button">تسمية</button>
    </div>
  </div>

  <div id="joystick-zone">
    <div id="joystick-knob"></div>
  </div>

  <div class="action-cluster">
    <button id="btn-launch" class="act-btn" type="button">إقلاع</button>
    <button id="btn-land" class="act-btn" type="button">نزول</button>
    <button id="btn-exit-all" class="act-btn" type="button">إخراج الكل</button>
    <button id="btn-door" class="act-btn" type="button">باب القفص</button>
    <button id="btn-feed" class="act-btn feed-btn" type="button">ذب علف</button>
    <button id="btn-water" class="act-btn water-btn" type="button">سقي ماي</button>
    <button id="btn-grab" class="act-btn grab-btn" type="button">لزم طير</button>
    <button id="btn-jump" class="act-btn" type="button">قفز</button>
  </div>

  <div id="market-modal" class="modal-overlay">
    <div class="market-card">
      <div class="market-header">
        <div class="market-title">سوق الغزل والملابس والأعلاف</div>
        <div class="market-balance">رصيدك: <span id="market-coins">250</span> د.ع</div>
        <button id="btn-close-market" class="close-market" type="button">إغلاق</button>
      </div>
      <div class="market-tabs">
        <button class="tab-btn active" data-tab="birds" type="button">بيع وشراء الحمام</button>
        <button class="tab-btn" data-tab="feed" type="button">الأعلاف والماي</button>
        <button class="tab-btn" data-tab="skins" type="button">سكنات المطيرجية</button>
        <button class="tab-btn" data-tab="coop" type="button">أقفاص وأدوية</button>
      </div>
      <div class="market-body" id="market-items-list"></div>
    </div>
  </div>

  <div id="leaderboard-modal" class="modal-overlay">
    <div class="market-card" style="max-width: 380px;">
      <div class="market-header">
        <div class="market-title">ترتيب اللاعبين أونلاين</div>
        <button id="btn-close-leaderboard" class="close-market" type="button">إغلاق</button>
      </div>
      <div class="market-body" id="leaderboard-list"></div>
    </div>
  </div>

  <div id="visit-modal" class="modal-overlay">
    <div class="market-card" style="max-width: 380px;">
      <div class="market-header">
        <div class="market-title">زيارة أسطح اللاعبين</div>
        <button id="btn-close-visit" class="close-market" type="button">إغلاق</button>
      </div>
      <div class="market-body" id="visit-players-list"></div>
    </div>
  </div>

  <div id="rename-modal" class="modal-overlay">
    <div class="market-card" style="max-width: 320px;">
      <div class="market-header">
        <div class="market-title">تسمية الطير</div>
        <button id="btn-close-rename" class="close-market" type="button">إلغاء</button>
      </div>
      <div class="market-body">
        <input id="rename-input" class="rename-input" type="text" maxlength="18" placeholder="اسم الطير..." />
        <button id="btn-save-rename" class="buy-btn" style="width:100%; padding:6px;" type="button">حفظ الاسم</button>
      </div>
    </div>
  </div>

  <script>
    (function loadThreeAndBoot() {
      function bootGame() {
        if (!window.THREE) return;
        initPigeonKingdomOnline();
      }
      if (window.THREE) {
        bootGame();
        return;
      }
      const s1 = document.createElement('script');
      s1.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
      s1.onload = bootGame;
      s1.onerror = function () {
        const s2 = document.createElement('script');
        s2.src = 'https://unpkg.com/three@0.128.0/build/three.min.js';
        s2.onload = bootGame;
        document.head.appendChild(s2);
      };
      document.head.appendChild(s1);
    })();

    function initPigeonKingdomOnline() {
      const SAVE_KEY = 'pigeon_kingdom_online_v3';
      const SERVER_URL = 'wss://super-octo-happinessmm-production.up.railway.app';
      const canvas = document.getElementById('game-canvas');
      const SKY_COLOR = 0x87b5d6;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(SKY_COLOR);
      scene.fog = new THREE.FogExp2(SKY_COLOR, 0.0012);

      const camera = new THREE.PerspectiveCamera(
        56,
        (window.innerWidth || 1280) / (window.innerHeight || 720),
        0.1,
        1800
      );

      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: 'high-performance' });
      } catch (e) {
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false });
      }
      renderer.setClearColor(SKY_COLOR, 1);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
      renderer.setSize(window.innerWidth || 1280, window.innerHeight || 720);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.render(scene, camera);

      const toastEl = document.getElementById('toast-msg');
      let toastTimer = null;
      function showToast(text) {
        toastEl.textContent = text;
        toastEl.style.opacity = '1';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastEl.style.opacity = '0';
        }, 3000);
      }

      const BREEDS = [
        {
          id: 'zajil',
          name: 'زاجل',
          price: 75,
          sellPrice: 50,
          body: 0x64748b,
          wing: 0x334155,
          neck: 0x0f766e,
          eye: 0xf97316,
          speed: 12.8,
          info: 'سريع جداً بالتحليق لمسافات بعيدة ودقيق بالعودة للسطح.'
        },
        {
          id: 'ahmar',
          name: 'أحمر',
          price: 85,
          sellPrice: 55,
          body: 0x991b1b,
          wing: 0x7f1d1d,
          neck: 0xb45309,
          eye: 0xfacc15,
          speed: 11.9,
          info: 'ريش قرمزي متين وقوة تحمل عالية في الجو.'
        },
        {
          id: 'lawat',
          name: 'لوات',
          price: 95,
          sellPrice: 65,
          body: 0x1e293b,
          wing: 0xf8fafc,
          neck: 0x0f172a,
          eye: 0x38bdf8,
          speed: 12.3,
          info: 'مناوراته الجوية رشيقة ويستجيب بسرعة للصفارة.'
        },
        {
          id: 'arafel',
          name: 'أرافل',
          price: 90,

      function createRoofTileTexture() {
        const c = document.createElement('canvas');
        c.width = 256; c.height = 256;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#c49a6c'; ctx.fillRect(0, 0, 256, 256);
        ctx.strokeStyle = '#9c754b'; ctx.lineWidth = 3;
        for (let i = 0; i <= 256; i += 64) {
          ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(256, i); ctx.stroke();
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(9, 9);
        return tex;
      }

      function createBrickTexture() {
        const c = document.createElement('canvas');
        c.width = 256; c.height = 256;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#b88b5a'; ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = '#a47748';
        for (let y = 0; y < 256; y += 32) {
          const offset = (y / 32) % 2 === 0 ? 0 : 32;
          for (let x = -32; x < 256; x += 64) {
            ctx.fillRect(x + offset + 2, y + 2, 60, 28);
          }
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(4, 3);
        return tex;
      }

      function createWireMeshTexture() {

        c.width = 128; c.height = 128;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, 128, 128);
        ctx.strokeStyle = 'rgba(40, 40, 46, 0.72)';
        ctx.lineWidth = 2;
        for (let i = -128; i < 256; i += 16) {
          ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + 128, 128); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(i + 128, 0); ctx.lineTo(i, 128); ctx.stroke();
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(6, 4);
        return tex;
      }

      function createNameSprite(text, bgColor = 'rgba(15, 15, 22, 0.84)', borderColor = '#ef4444') {

        ctx.beginPath();
        ctx.roundRect(14, 10, 292, 54, 18);
        ctx.fill();
        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 25px Cairo, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 160, 38);
        const tex = new THREE.CanvasTexture(c);
        const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(1.3, 0.3, 1);
        return sprite;

      class Pigeon {
        constructor(index, forcedBreed = null, options = {}) {
          this.uid = options.uid || ('p_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7));
          this.breed = forcedBreed || BREEDS[index % BREEDS.length];
          this.customName = options.customName || '';
          this.isChick = !!options.isChick;
          this.isTamed = !!options.isTamed;

          const vis = createBirdVisuals(this.breed, this.isChick);
          this.group = vis.group;
          this.leftWing = vis.leftWing;
          this.rightWing = vis.rightWing;

          this.nameSprite = null;
          this.refreshNameLabel();

          this.isInsideCoop = options.isInsideCoop !== undefined ? options.isInsideCoop : true;
          const lx = this.isInsideCoop ? COOP.x + (Math.random() - 0.5) * (COOP.w - 1.4) : -2.0 + (Math.random() - 0.5) * 9.0;
          const lz = this.isInsideCoop ? COOP.z + (Math.random() - 0.5) * (COOP.d - 1.4) : 3.0 + (Math.random() - 0.5) * 7.0;
          this.group.position.set(homeRoofX + lx, ROOF_Y, homeRoofZ + lz);
          scene.add(this.group);

          this.state = 'WALK';
          this.targetPos = this.group.position.clone();
          this.velocity = new THREE.Vector3();
          this.orbitAngle = (index / 12) * Math.PI * 2;
          this.orbitRadius = 18 + (index % 5) * 4.0;
          this.cruiseAlt = 24 + (index % 6) * 2.2;
          this.flapPhase = Math.random() * Math.PI * 2;
          this.idleTimer = Math.random() * 2.0;
          this.foldWings();
        }

        getDisplayName() {
          const base = this.customName ? `${this.customName} (${this.breed.name})` : this.breed.name;
          if (this.isChick) return `فرخ ${base}`;
          if (this.isTamed) return `★ ${base}`;
          return base;
        }

        refreshNameLabel() {
          if (this.nameSprite) {
            this.group.remove(this.nameSprite);
            this.nameSprite = null;
          }
          this.nameSprite = createNameSprite(
            this.getDisplayName(),
            this.isTamed ? 'rgba(6, 78, 59, 0.88)' : 'rgba(15, 15, 22, 0.82)',
            this.isTamed ? '#34d399' : '#ef4444'
          );
          this.nameSprite.position.set(0, 0.72, 0);
          this.group.add(this.nameSprite);
        }

        updateNameVisibility() {
          if (!this.nameSprite) return;
          const onGround = this.state !== 'FLYING' && this.state !== 'LANDING';
          this.nameSprite.visible = onGround;
        }

        foldWings() {
          this.leftWing.rotation.set(0.05, -0.14, -1.48);
          this.rightWing.rotation.set(0.05, 0.14, 1.48);
        }

        flapWings(ang) {
          this.leftWing.rotation.set(0, 0, ang);
          this.rightWing.rotation.set(0, 0, -ang);
        }

        startSkyFlight() {
          if (this.isChick) return;
          this.state = 'FLYING';
          this.isInsideCoop = false;
          this.orbitAngle = Math.atan2(this.group.position.z - homeRoofZ, this.group.position.x - homeRoofX);
          this.velocity.set((Math.random() - 0.5) * 4.5, 6.2, (Math.random() - 0.5) * 4.5);
          this.updateNameVisibility();
        }

        commandLaunch() {
          if (this.isChick || this.state === 'FLYING' || this.state === 'HELD') return;
          if (this.isInsideCoop && !COOP.isOpen) {
            COOP.isOpen = true;
            document.getElementById('stat-door').textContent = 'مفتوح';
          }
          this.startSkyFlight();
        }

        commandLand() {
          if (this.state === 'WALK' || this.state === 'HELD') return;
          this.state = 'LANDING';
          this.targetPos.set(
            homeRoofX - 3.0 + (Math.random() - 0.5) * 10,
            ROOF_Y,
            homeRoofZ + 3.2 + (Math.random() - 0.5) * 7.5
          );
          this.updateNameVisibility();
        }

        update(dt, elapsed, allPigeons) {
          this.updateNameVisibility();

          if (this.state === 'HELD' || this.state === 'TAMED_PERCHED') {
            this.foldWings();
            return;
          }

          this.flapPhase += dt * 16.5;

          if (this.state === 'WALK') {
            this.foldWings();
            if (gameState.activeFeedPile && !this.isInsideCoop) {
              const ang = (this.flapPhase * 0.37) % (Math.PI * 2);
              this.targetPos.set(
                homeRoofX + gameState.activeFeedPile.lx + Math.cos(ang) * 0.9,
                ROOF_Y,
                homeRoofZ + gameState.activeFeedPile.lz + Math.sin(ang) * 0.9
              );
            } else {
              this.idleTimer -= dt;
              if (this.idleTimer <= 0) {
                this.idleTimer = 1.6 + Math.random() * 2.2;
                if (this.isInsideCoop) {
                  this.targetPos.set(
                    homeRoofX + COOP.x + (Math.random() - 0.5) * (COOP.w - 1.3),
                    ROOF_Y,
                    homeRoofZ + COOP.z + (Math.random() - 0.5) * (COOP.d - 1.3)
                  );
                } else {
                  this.targetPos.set(
                    homeRoofX - 3.0 + (Math.random() - 0.5) * 11,
                    ROOF_Y,
                    homeRoofZ + 3.0 + (Math.random() - 0.5) * 8.5
                  );
                }
              }
            }

            const toTarget = this.targetPos.clone().sub(this.group.position);
            toTarget.y = 0;
            if (toTarget.length() > 0.12) {
              toTarget.normalize();
              this.group.position.addScaledVector(toTarget, dt * (this.isChick ? 0.75 : 1.2));
              this.group.rotation.y = Math.atan2(toTarget.x, toTarget.z);
            }
          } else if (this.state === 'FLYING') {
            this.flapWings(Math.sin(this.flapPhase) * 0.78);
            this.orbitAngle += dt * 0.42;
            const tx = homeRoofX + Math.cos(this.orbitAngle) * this.orbitRadius;
            const tz = homeRoofZ + Math.sin(this.orbitAngle) * this.orbitRadius;
            const ty = this.cruiseAlt + Math.sin(elapsed * 1.6 + this.orbitAngle * 2) * 1.8;

            const seek = new THREE.Vector3(tx, ty, tz).sub(this.group.position).multiplyScalar(1.5);
            const sep = new THREE.Vector3();
            for (let i = 0; i < allPigeons.length; i++) {
              const other = allPigeons[i];
              if (other === this || other.state !== 'FLYING') continue;
              const diff = this.group.position.clone().sub(other.group.position);
              const d = diff.length();
              if (d > 0.01 && d < 3.4) {
                sep.addScaledVector(diff.normalize(), ((3.4 - d) / 3.4) * 18.0);
              }
            }

            this.velocity.addScaledVector(seek.add(sep), dt);
            if (this.velocity.length() > this.breed.speed) {
              this.velocity.normalize().multiplyScalar(this.breed.speed);
            }
            this.group.position.addScaledVector(this.velocity, dt);
            if (this.velocity.lengthSq() > 0.1) {
              this.group.rotation.y = Math.atan2(this.velocity.x, this.velocity.z);
            }
          } else if (this.state === 'LANDING') {
            this.flapWings(Math.sin(this.flapPhase * 1.2) * 0.7);
            const dir = this.targetPos.clone().sub(this.group.position);
            if (dir.length() < 0.25) {
              this.group.position.copy(this.targetPos);
              this.state = 'WALK';
              this.foldWings();
              this.updateNameVisibility();
            } else {
              dir.normalize();
              this.group.position.addScaledVector(dir, dt * 8.4);
              this.group.rotation.y = Math.atan2(dir.x, dir.z);
            }
          }
        }
      }

      class PlayerCharacter {
        constructor() {
          this.group = new THREE.Group();
          this.group.position.set(homeRoofX + 1.2, ROOF_Y, homeRoofZ + 5.2);
          scene.add(this.group);
          this.velY = 0;
          this.isGrounded = true;
          this.walkCycle = 0;
          this.buildSkin(gameState.currentSkin);
        }

        buildSkin(skinId) {
          while (this.group.children.length > 0) this.group.remove(this.group.children[0]);
          const skinMat = new THREE.MeshStandardMaterial({ color: 0xd2a176, roughness: 0.65 });
          const hairMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.8 });
          const eyeWhiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
          const pupilMat = new THREE.MeshBasicMaterial({ color: 0x18181b });
          const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.72 });
          const redMat = new THREE.MeshStandardMaterial({ color: 0x991b1b, roughness: 0.6 });
          const navyMat = new THREE.MeshStandardMaterial({ color: 0x1e3a8a, roughness: 0.65 });
          const blackMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.65 });
          const pajamaMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.8 });

          const headGroup = new THREE.Group();
          headGroup.position.set(0, 1.58, 0);
          this.group.add(headGroup);

          const head = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.38, 0.36), skinMat);
          headGroup.add(head);

          const hair = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.13, 0.38), hairMat);
          hair.position.set(0, 0.18, -0.01);
          const backHair = new THREE.Mesh(new THREE.BoxGeometry(0.37, 0.24, 0.08), hairMat);
          backHair.position.set(0, 0.06, -0.16);
          headGroup.add(hair, backHair);

          [-1, 1].forEach((side) => {
            const ew = new THREE.Mesh(new THREE.BoxGeometry(0.065, 0.045, 0.02), eyeWhiteMat);
            ew.position.set(side * 0.085, 0.02, 0.185);
            const pu = new THREE.Mesh(new THREE.BoxGeometry(0.032, 0.035, 0.024), pupilMat);
            pu.position.set(side * 0.085, 0.02, 0.19);
            headGroup.add(ew, pu);
          });

          const nose = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.065, 0.05), skinMat);
          nose.position.set(0, -0.02, 0.195);
          headGroup.add(nose);

          if (skinId === 'baghdadi') {
            const agal = new THREE.Mesh(new THREE.TorusGeometry(0.19, 0.024, 8, 20), blackMat);
            agal.rotation.x = Math.PI / 2;
            agal.position.set(0, 0.21, 0);
            headGroup.add(agal);
          }

          const torsoMat = skinId === 'basrawi' ? navyMat : skinId === 'champion' ? blackMat : whiteMat;
          const legMat = skinId === 'fanila' ? pajamaMat : skinId === 'basrawi' ? navyMat : skinId === 'champion' ? blackMat : whiteMat;
          const sleeveMat = skinId === 'fanila' ? skinMat : torsoMat;

          const torso = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.72, 0.28), torsoMat);
          torso.position.y = 1.04;
          this.group.add(torso);

          if (skinId === 'baghdadi' || skinId === 'champion') {
            const vest = new THREE.Mesh(new THREE.BoxGeometry(0.51, 0.56, 0.31), redMat);
            vest.position.y = 1.11;
            this.group.add(vest);
          }

          this.leftArmPivot = new THREE.Group();
          this.leftArmPivot.position.set(0.33, 1.32, 0);
          this.leftArmPivot.add(new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.56, 0.15), sleeveMat).translateY(-0.28));

          this.rightArmPivot = new THREE.Group();
          this.rightArmPivot.position.set(-0.33, 1.32, 0);
          this.rightArmPivot.add(new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.56, 0.15), sleeveMat).translateY(-0.28));
          this.group.add(this.leftArmPivot, this.rightArmPivot);

          this.leftLegPivot = new THREE.Group();
          this.leftLegPivot.position.set(0.13, 0.70, 0);
          this.leftLegPivot.add(new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.66, 0.20), legMat).translateY(-0.33));

          this.rightLegPivot = new THREE.Group();
          this.rightLegPivot.position.set(-0.13, 0.70, 0);
          this.rightLegPivot.add(new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.66, 0.20), legMat).translateY(-0.33));
          this.group.add(this.leftLegPivot, this.rightLegPivot);
        }

        getPerchPos() {
          const off = new THREE.Vector3(-0.24, 1.44, 0.02);
          off.applyAxisAngle(new THREE.Vector3(0, 1, 0), this.group.rotation.y);
          return this.group.position.clone().add(off);
        }

        jump() {
          if (this.isGrounded) {
            this.velY = 8.6;
            this.isGrounded = false;
          }
        }

        resolveRooftopBounds(nx, nz) {
          let x = nx;
          let z = nz;
          const minX = currentRoofX - ROOF_HALF + 0.55;
          const maxX = currentRoofX + ROOF_HALF - 0.55;
          const minZ = currentRoofZ - ROOF_HALF + 0.55;
          const maxZ = currentRoofZ + ROOF_HALF - 0.55;
          if (x < minX) x = minX;
          if (x > maxX) x = maxX;
          if (z < minZ) z = minZ;
          if (z > maxZ) z = maxZ;
          return { x, z };
        }

        update(dt, moveForward, moveRight, camYaw) {
          const forwardVec = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw));
          const rightVec = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw));
          const wishDir = new THREE.Vector3().addScaledVector(forwardVec, moveForward).addScaledVector(rightVec, moveRight);

          let isMoving = false;
          if (wishDir.lengthSq() > 0.002) {
            isMoving = true;
            wishDir.normalize();
            const bounded = this.resolveRooftopBounds(
              this.group.position.x + wishDir.x * 5.6 * dt,
              this.group.position.z + wishDir.z * 5.6 * dt
            );
            this.group.position.x = bounded.x;
            this.group.position.z = bounded.z;

            const targetYaw = Math.atan2(wishDir.x, wishDir.z);
            let diff = targetYaw - this.group.rotation.y;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            this.group.rotation.y += diff * Math.min(1, dt * 16);
          }

          this.velY -= 21.0 * dt;
          this.group.position.y += this.velY * dt;
          if (this.group.position.y <= ROOF_Y) {
            this.group.position.y = ROOF_Y;
            this.velY = 0;
            this.isGrounded = true;
          } else {
            this.isGrounded = false;
          }

          if (isMoving && this.isGrounded) {
            this.walkCycle += dt * 11;
            const swing = Math.sin(this.walkCycle) * 0.58;
            this.leftLegPivot.rotation.x = swing;
            this.rightLegPivot.rotation.x = -swing;
            this.leftArmPivot.rotation.x = -swing * 0.6;
            this.rightArmPivot.rotation.x = swing * 0.6;
          } else {
            this.leftLegPivot.rotation.x *= 0.82;
            this.rightLegPivot.rotation.x *= 0.82;
            this.leftArmPivot.rotation.x *= 0.82;
            this.rightArmPivot.rotation.x *= 0.82;
          }

          if (gameState.heldPigeon) {
            gameState.heldPigeon.group.position.copy(this.getPerchPos());
            gameState.heldPigeon.group.rotation.y = this.group.rotation.y;
          }
        }
      }

      player = new PlayerCharacter();

      const remotePlayers = new Map();

      function upsertRemotePlayer(pData) {
        if (!pData || !pData.id) return;
        let entry = remotePlayers.get(pData.id);
        if (!entry) {
          const rx = pData.roofX || 0;
          const rz = pData.roofZ || 0;
          const rHouse = new THREE.Group();
          rHouse.position.set(rx, 0, rz);
          buildFullRooftopStructure(rHouse, !!pData.doorOpen);
          scene.add(rHouse);

          const pMesh = new THREE.Group();
          const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.45, 0.32), new THREE.MeshStandardMaterial({ color: 0x0284c7 }));
          body.position.y = 0.85;
          const head = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.36, 0.36), new THREE.MeshStandardMaterial({ color: 0xd2a176 }));
          head.position.y = 1.78;
          const hair = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.12, 0.38), new THREE.MeshStandardMaterial({ color: 0x111115 }));
          hair.position.set(0, 1.96, 0);
          const tag = createNameSprite(`${pData.name || 'لاعب'} (سطح #${pData.slot || '?'})`, 'rgba(12, 74, 110, 0.88)', '#38bdf8');
          tag.position.set(0, 2.32, 0);
          pMesh.add(body, head, hair, tag);
          scene.add(pMesh);

          entry = {
            data: pData,
            house: rHouse,
            mesh: pMesh,
            remoteBirds: []
          };
          remotePlayers.set(pData.id, entry);
        }

        entry.data = Object.assign(entry.data, pData);
        entry.house.position.set(entry.data.roofX || 0, 0, entry.data.roofZ || 0);
        entry.mesh.position.set(entry.data.x || 0, entry.data.y || ROOF_Y, entry.data.z || 0);
        entry.mesh.rotation.y = entry.data.yaw || 0;

        if (Array.isArray(pData.pigeons)) {
          while (entry.remoteBirds.length > pData.pigeons.length) {
            const old = entry.remoteBirds.pop();
            scene.remove(old.group);
          }
          pData.pigeons.forEach((bp, idx) => {
            let rb = entry.remoteBirds[idx];
            const br = BREEDS.find((x) => x.id === bp.breedId) || BREEDS[idx % BREEDS.length];
            if (!rb) {
              const vis = createBirdVisuals(br, !!bp.isChick);
              const lbl = createNameSprite(bp.name || br.name);
              lbl.position.set(0, 0.72, 0);
              vis.group.add(lbl);
              scene.add(vis.group);
              rb = { group: vis.group, leftWing: vis.leftWing, rightWing: vis.rightWing, lbl, breedId: br.id };
              entry.remoteBirds[idx] = rb;
            }
            rb.group.position.set(bp.x, bp.y, bp.z);
            rb.group.rotation.y = bp.yaw || 0;
            rb.lbl.visible = !bp.flying;
            if (bp.flying) {
              const wAng = Math.sin(performance.now() * 0.018 + idx) * 0.75;
              rb.leftWing.rotation.set(0, 0, wAng);
              rb.rightWing.rotation.set(0, 0, -wAng);
            } else {
              rb.leftWing.rotation.set(0.05, -0.14, -1.48);
              rb.rightWing.rotation.set(0.05, 0.14, 1.48);
            }
          });
        }
      }

      function removeRemotePlayer(id) {
        const entry = remotePlayers.get(id);
        if (entry) {
          scene.remove(entry.house);
          scene.remove(entry.mesh);
          entry.remoteBirds.forEach((rb) => scene.remove(rb.group));
          remotePlayers.delete(id);
        }
      }

      function setActiveRooftop(rx, rz, hostName = null) {
        const dx = rx - currentRoofX;
        const dz = rz - currentRoofZ;
        currentRoofX = rx;
        currentRoofZ = rz;
        visitingHostName = hostName;

        player.group.position.x += dx;
        player.group.position.z += dz;
        const bounded = player.resolveRooftopBounds(player.group.position.x, player.group.position.z);
        player.group.position.x = bounded.x;
        player.group.position.z = bounded.z;
        updateHudStats(pigeons.filter((p) => p.state === 'FLYING').length);
      }

      function connectOnlineServer() {
        try {
          wsClient = new WebSocket(SERVER_URL);
          wsClient.addEventListener('message', (ev) => {
            let msg;
            try { msg = JSON.parse(ev.data); } catch (e) { return; }

            if (msg.type === 'WELCOME') {
              onlineCount = msg.onlineCount || 1;
              if (msg.self) {
                myOnlineId = msg.self.id;
                mySlot = msg.self.slot || 1;
                homeRoofX = msg.self.roofX || 0;
                homeRoofZ = msg.self.roofZ || 0;
                myHouseGroup.position.set(homeRoofX, 0, homeRoofZ);
                waterBowlGroup.position.set(-2.2, ROOF_Y, 2.4);
                currentRoofX = homeRoofX;
                currentRoofZ = homeRoofZ;
                player.group.position.set(homeRoofX + 1.2, ROOF_Y, homeRoofZ + 5.2);
                pigeons.forEach((p, idx) => {
                  const lx = p.isInsideCoop ? COOP.x + ((idx % 4) - 1.5) * 1.1 : -2.0 + ((idx % 4) - 1.5) * 1.8;
                  const lz = p.isInsideCoop ? COOP.z + (Math.floor(idx / 4) - 1) * 1.1 : 3.2;
                  p.group.position.set(homeRoofX + lx, ROOF_Y, homeRoofZ + lz);
                  p.targetPos.copy(p.group.position);
                });
              }
              if (Array.isArray(msg.players)) msg.players.forEach(upsertRemotePlayer);
              if (Array.isArray(msg.leaderboard)) leaderboardData = msg.leaderboard;
              updateHudStats(pigeons.filter((p) => p.state === 'FLYING').length);
            } else if (msg.type === 'PLAYER_JOINED') {
              onlineCount = msg.onlineCount || onlineCount + 1;
              if (msg.player) upsertRemotePlayer(msg.player);
              if (Array.isArray(msg.leaderboard)) leaderboardData = msg.leaderboard;
              updateHudStats(pigeons.filter((p) => p.state === 'FLYING').length);
            } else if (msg.type === 'PLAYER_STATE') {
              if (msg.player) upsertRemotePlayer(msg.player);
            } else if (msg.type === 'PLAYER_LEFT') {
              onlineCount = msg.onlineCount || Math.max(1, onlineCount - 1);
              removeRemotePlayer(msg.id);
              if (Array.isArray(msg.leaderboard)) leaderboardData = msg.leaderboard;
              updateHudStats(pigeons.filter((p) => p.state === 'FLYING').length);
            } else if (msg.type === 'LEADERBOARD_SYNC') {
              onlineCount = msg.onlineCount || onlineCount;
              if (Array.isArray(msg.leaderboard)) leaderboardData = msg.leaderboard;
              updateHudStats(pigeons.filter((p) => p.state === 'FLYING').length);
            } else if (msg.type === 'LAUNCH_REWARD_APPROVED') {
              if (typeof msg.coins === 'number') {
                gameState.coins = msg.coins;
                updateHudStats(pigeons.filter((p) => p.state === 'FLYING').length);
                saveGameAuto();
                showToast(`إقلاع السرب! مكافأة +${msg.reward || 25} د.ع`);
              }
            } else if (msg.type === 'VISIT_REQUEST') {
              pendingVisitRequest = msg;
              visitPromptText.textContent = `يريد (${msg.fromName}) زيارة سطحك`;
              visitPromptEl.style.display = 'flex';
            } else if (msg.type === 'VISIT_ACCEPTED') {
              const targetX = typeof msg.roofX === 'number' ? msg.roofX : currentRoofX;
              const targetZ = typeof msg.roofZ === 'number' ? msg.roofZ : currentRoofZ;
              setActiveRooftop(targetX, targetZ, msg.hostName || `سطح #${msg.hostSlot}`);
              showToast(`تم قبول الزيارة! أنت الآن على سطح ${msg.hostName}`);
            } else if (msg.type === 'VISIT_DECLINED') {
              showToast(`رفض (${msg.hostName}) طلب الزيارة`);
            } else if (msg.type === 'CHAT_MSG') {
              appendChatMessage(msg.fromName, msg.text, msg.fromId || null);
              showToast(`${msg.fromName}: ${msg.text}`);
            }
          });
          wsClient.addEventListener('close', () => {
            onlineCount = 1;
            updateHudStats(pigeons.filter((p) => p.state === 'FLYING').length);
          });
          wsClient.addEventListener('error', () => {});
        } catch (e) {}
      }
      connectOnlineServer();

      function sendOnlineState(flyingCount) {
        if (!wsClient || wsClient.readyState !== WebSocket.OPEN) return;
        wsClient.send(JSON.stringify({
          type: 'STATE_UPDATE',
          x: player.group.position.x,
          y: player.group.position.y,
          z: player.group.position.z,
          yaw: player.group.rotation.y,
          skin: gameState.currentSkin,
          coins: Math.floor(gameState.coins),
          flyingCount,
          doorOpen: COOP.isOpen,
          pigeons: pigeons.map((p) => ({
            breedId: p.breed.id,
            name: p.getDisplayName(),
            flying: p.state === 'FLYING' || p.state === 'LANDING',
            isChick: p.isChick,
            x: p.group.position.x,
            y: p.group.position.y,
            z: p.group.position.z,
            yaw: p.group.rotation.y
          }))
        }));
      }

      function saveGameAuto() {
        try {
          localStorage.setItem(SAVE_KEY, JSON.stringify({
            coins: Math.floor(gameState.coins),
            feeds: gameState.feeds,
            waters: gameState.waters,
            ownedSkins: gameState.ownedSkins,
            currentSkin: gameState.currentSkin,
            pigeons: pigeons.map((p) => ({
              uid: p.uid,
              breedId: p.breed.id,
              customName: p.customName,
              isChick: p.isChick,
              isTamed: p.isTamed,
              isInsideCoop: p.isInsideCoop
            }))
          }));
        } catch (e) {}
      }

      function loadGameAuto() {
        try {
          const raw = localStorage.getItem(SAVE_KEY);
          if (!raw) return false;
          const d = JSON.parse(raw);
          if (typeof d.coins === 'number') gameState.coins = d.coins;
          if (d.feeds) gameState.feeds = Object.assign(gameState.feeds, d.feeds);
          if (d.waters) gameState.waters = Object.assign(gameState.waters, d.waters);
          if (Array.isArray(d.ownedSkins)) gameState.ownedSkins = d.ownedSkins;
          if (d.currentSkin) {
            gameState.currentSkin = d.currentSkin;
            player.buildSkin(d.currentSkin);
          }
          if (Array.isArray(d.pigeons) && d.pigeons.length > 0) {
            d.pigeons.forEach((sp, idx) => {
              const b = BREEDS.find((br) => br.id === sp.breedId) || BREEDS[idx % BREEDS.length];
              pigeons.push(new Pigeon(idx, b, sp));
            });
            return true;
          }
        } catch (e) {}
        return false;
      }

      if (!loadGameAuto()) {
        for (let i = 0; i < 12; i++) {
          pigeons.push(new Pigeon(i, BREEDS[i % BREEDS.length], { isInsideCoop: true }));
        }
      }

      const heldBarEl = document.getElementById('held-bird-bar');
      const heldTitleEl = document.getElementById('held-bird-title');

      document.getElementById('btn-launch').addEventListener('click', () => {
        let launchedAny = false;
        pigeons.forEach((p) => {
          if (!p.isChick && p.state !== 'FLYING' && p.state !== 'HELD') {
            p.commandLaunch();
            launchedAny = true;

          showToast('السرب طائر بالفعل أو لا توجد طيور جاهزة للإقلاع.');
          return;
        }
        const now = Date.now();
        if (wsClient && wsClient.readyState === WebSocket.OPEN) {
          wsClient.send(JSON.stringify({ type: 'CLAIM_LAUNCH_REWARD' }));
        } else if (now - gameState.lastFlightRewardTime >= 20000) {
          gameState.lastFlightRewardTime = now;

          saveGameAuto();
          showToast('إقلاع السرب! (+25 د.ع)');

      document.getElementById('btn-land').addEventListener('click', () => {
        pigeons.forEach((p) => { if (p.state === 'FLYING') p.commandLand(); });
        showToast('صفارة نزول! السرب ينزل إلى السطح.');
      });

      document.getElementById('btn-exit-all').addEventListener('click', () => {
        COOP.isOpen = true;
        document.getElementById('stat-door').textContent = 'مفتوح';
        pigeons.forEach((p) => {
          if (p.isInsideCoop && p.state === 'WALK') {
            p.isInsideCoop = false;
            p.targetPos.set(homeRoofX - 2.0 + (Math.random() - 0.5) * 7, ROOF_Y, homeRoofZ + 3.5);
          }
        });
        showToast('تم فتح باب القفص وخروج الحمام.');
      });

      document.getElementById('btn-door').addEventListener('click', () => {
        COOP.isOpen = !COOP.isOpen;
        document.getElementById('stat-door').textContent = COOP.isOpen ? 'مفتوح' : 'مغلق';
      });

      document.getElementById('btn-feed').addEventListener('click', () => {
        const order = ['mashboosh', 'taman', 'adas', 'qamh'];
        const key = order.find((k) => (gameState.feeds[k] || 0) > 0);
        if (!key) { showToast('لا يوجد علف! اشترِ من السوق.'); return; }
        gameState.feeds[key] -= 1;
        gameState.activeFeedPile = {
          lx: player.group.position.x - homeRoofX,
          lz: player.group.position.z - homeRoofZ,
          timer: 16
        };
        pigeons.forEach((p) => { if (p.state === 'FLYING') p.commandLand(); });
        updateHudStats(pigeons.filter((p) => p.state === 'FLYING').length);
        saveGameAuto();
        showToast(`تم ذب علف (${FEED_TYPES[key].name}).`);
      });

      document.getElementById('btn-water').addEventListener('click', () => {
        const order = ['zamzam', 'helo', 'bori'];
        const key = order.find((k) => (gameState.waters[k] || 0) > 0);
        if (!key) { showToast('لا يوجد ماي! اشترِ من السوق.'); return; }
        gameState.waters[key] -= 1;
        waterSurface.material.color.setHex(WATER_TYPES[key].color);
        waterSurface.visible = true;
        gameState.activeWaterPile = { timer: 20 };
        updateHudStats(pigeons.filter((p) => p.state === 'FLYING').length);
        saveGameAuto();
        showToast(`تم سقي (${WATER_TYPES[key].name}).`);
      });

      document.getElementById('btn-grab').addEventListener('click', () => {
        if (gameState.heldPigeon) return;
        const nearest = pigeons.find((p) => p.state !== 'FLYING' && p.group.position.distanceTo(player.group.position) < 3.4);
        if (!nearest) { showToast('اقترب من طير للزمه.'); return; }
        gameState.heldPigeon = nearest;
        nearest.state = 'HELD';
        nearest.isInsideCoop = false;
        heldTitleEl.textContent = `ماسك طير: ${nearest.getDisplayName()}`;
        heldBarEl.style.display = 'flex';
      });

      document.getElementById('btn-put-ground').addEventListener('click', () => {
        const p = gameState.heldPigeon;
        if (!p) return;
        p.group.position.set(player.group.position.x + 0.7, ROOF_Y, player.group.position.z + 0.7);
        p.targetPos.copy(p.group.position);
        p.state = 'WALK';
        p.foldWings();
        p.updateNameVisibility();
        gameState.heldPigeon = null;
        heldBarEl.style.display = 'none';
      });

      document.getElementById('btn-release-fly').addEventListener('click', () => {
        const p = gameState.heldPigeon;
        if (!p || p.isChick) return;
        p.state = 'WALK';
        gameState.heldPigeon = null;
        heldBarEl.style.display = 'none';
        p.startSkyFlight();
      });

      document.getElementById('btn-tame-shoulder').addEventListener('click', () => {
        const p = gameState.heldPigeon;
        if (!p || p.isChick) return;
        pigeons.forEach((o) => { if (o !== p) { o.isTamed = false; o.refreshNameLabel(); } });
        p.isTamed = true;
        p.state = 'TAMED_PERCHED';
        gameState.tamedPigeonId = p.uid;
        p.refreshNameLabel();
        p.updateNameVisibility();
        gameState.heldPigeon = null;
        heldBarEl.style.display = 'none';
        saveGameAuto();
      });

      const renameModal = document.getElementById('rename-modal');
      const renameInput = document.getElementById('rename-input');
      document.getElementById('btn-rename-bird').addEventListener('click', () => {
        if (!gameState.heldPigeon) return;
        renameInput.value = gameState.heldPigeon.customName || '';
        renameModal.style.display = 'flex';
      });
      document.getElementById('btn-close-rename').addEventListener('click', () => { renameModal.style.display = 'none'; });
      document.getElementById('btn-save-rename').addEventListener('click', () => {
        if (gameState.heldPigeon) {
          gameState.heldPigeon.customName = renameInput.value.trim();
          gameState.heldPigeon.refreshNameLabel();
          gameState.heldPigeon.updateNameVisibility();
          heldTitleEl.textContent = `ماسك طير: ${gameState.heldPigeon.getDisplayName()}`;
        }
        renameModal.style.display = 'none';
        saveGameAuto();
      });

      document.getElementById('btn-jump').addEventListener('click', () => player.jump());

      const visitModal = document.getElementById('visit-modal');
      const visitListEl = document.getElementById('visit-players-list');

      document.getElementById('btn-visit-roof').addEventListener('click', () => {
        visitListEl.innerHTML = '';
        if (visitingHostName) {
          const retRow = document.createElement('div');
          retRow.className = 'shop-item';
          retRow.innerHTML = `<div class="shop-info"><h4>أنت حالياً تزور: ${visitingHostName}</h4><p>العودة إلى سطحك الخاص</p></div>`;
          const retBtn = document.createElement('button');
          retBtn.className = 'buy-btn sell-btn';
          retBtn.type = 'button';
          retBtn.textContent = 'رجوع لسطحي';
          retBtn.onclick = () => {
            setActiveRooftop(homeRoofX, homeRoofZ, null);
            visitModal.style.display = 'none';
            showToast('عدت إلى سطحك.');
          };
          retRow.appendChild(retBtn);
          visitListEl.appendChild(retRow);
        }

        const list = Array.from(remotePlayers.values());
        if (list.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'shop-item';
          empty.innerHTML = `<div class="shop-info"><h4>لا يوجد لاعبون آخرون متصلون حالياً</h4><p>أرسل رسالة في الدردشة أو انتظر دخول لاعبين.</p></div>`;
          visitListEl.appendChild(empty);
        } else {
          list.forEach((entry) => {
            const row = document.createElement('div');
            row.className = 'shop-item';
            row.innerHTML = `<div class="shop-info"><h4>${entry.data.name || 'لاعب'} (سطح #${entry.data.slot || '?'})</h4><p>الرصيد: ${entry.data.coins || 0} د.ع</p></div>`;
            const btn = document.createElement('button');
            btn.className = 'buy-btn';
            btn.type = 'button';
            btn.textContent = 'طلب زيارة';
            btn.onclick = () => {
              visitModal.style.display = 'none';
              sendVisitRequest(entry.data.id, entry.data.name || 'لاعب');
            };
            row.appendChild(btn);
            visitListEl.appendChild(row);
          });
        }
        visitModal.style.display = 'flex';
      });
      document.getElementById('btn-close-visit').addEventListener('click', () => { visitModal.style.display = 'none'; });

      const marketModal = document.getElementById('market-modal');
      const marketListEl = document.getElementById('market-items-list');
      let currentMarketTab = 'birds';

      function renderMarketTab(tab) {
        currentMarketTab = tab;
        document.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
        marketListEl.innerHTML = '';
        document.getElementById('market-coins').textContent = Math.floor(gameState.coins);

        if (tab === 'birds') {
          BREEDS.forEach((b) => {
            const row = document.createElement('div');
            row.className = 'shop-item';
            row.innerHTML = `<div class="shop-info"><h4>حمام ${b.name}</h4><p>${b.info} • شراء: ${b.price} د.ع • بيع: ${b.sellPrice} د.ع</p></div><div style="display:flex;gap:4px;"><button class="buy-btn" type="button">شراء</button><button class="buy-btn sell-btn" type="button">بيع</button></div>`;
            const [buyBtn, sellBtn] = row.querySelectorAll('button');
            buyBtn.onclick = () => {
              if (gameState.coins < b.price) { showToast('رصيدك غير كافٍ!'); return; }
              gameState.coins -= b.price;
              pigeons.push(new Pigeon(pigeons.length, b, { isInsideCoop: true }));
              updateHudStats(pigeons.filter((p) => p.state === 'FLYING').length);
              saveGameAuto();
              renderMarketTab('birds');
            };
            sellBtn.onclick = () => {
              const idx = pigeons.findIndex((p) => p.breed.id === b.id && !p.isChick);
              if (idx === -1) { showToast('لا يوجد طير للبيع من هذا النوع'); return; }
              scene.remove(pigeons[idx].group);
              pigeons.splice(idx, 1);
              gameState.coins += b.sellPrice;
              updateHudStats(pigeons.filter((p) => p.state === 'FLYING').length);
              saveGameAuto();
              renderMarketTab('birds');
            };
            marketListEl.appendChild(row);
          });
        } else if (tab === 'feed') {
          Object.values(FEED_TYPES).forEach((ft) => {
            const row = document.createElement('div');
            row.className = 'shop-item';
            row.innerHTML = `<div class="shop-info"><h4>علف ${ft.name} (+${ft.qty}) — لديك: ${gameState.feeds[ft.id] || 0}</h4><p>${ft.desc}</p></div><button class="buy-btn" type="button">شراء (${ft.price} د.ع)</button>`;
            row.querySelector('button').onclick = () => {
              if (gameState.coins < ft.price) { showToast('رصيدك غير كافٍ!'); return; }
              gameState.coins -= ft.price;
              gameState.feeds[ft.id] = (gameState.feeds[ft.id] || 0) + ft.qty;
              updateHudStats(pigeons.filter((p) => p.state === 'FLYING').length);
              saveGameAuto();
              renderMarketTab('feed');
            };
            marketListEl.appendChild(row);
          });
          Object.values(WATER_TYPES).forEach((wt) => {
            const row = document.createElement('div');
            row.className = 'shop-item';
            row.innerHTML = `<div class="shop-info"><h4>${wt.name} (+${wt.qty}) — لديك: ${gameState.waters[wt.id] || 0}</h4><p>${wt.desc}</p></div><button class="buy-btn" type="button">شراء (${wt.price} د.ع)</button>`;
            row.querySelector('button').onclick = () => {
              if (gameState.coins < wt.price) { showToast('رصيدك غير كافٍ!'); return; }
              gameState.coins -= wt.price;
              gameState.waters[wt.id] = (gameState.waters[wt.id] || 0) + wt.qty;
              updateHudStats(pigeons.filter((p) => p.state === 'FLYING').length);
              saveGameAuto();
              renderMarketTab('feed');
            };
            marketListEl.appendChild(row);
          });
        } else if (tab === 'skins') {
          SKINS.forEach((sk) => {
            const owned = gameState.ownedSkins.includes(sk.id);
            const equipped = gameState.currentSkin === sk.id;
            const row = document.createElement('div');
            row.className = 'shop-item';
            row.innerHTML = `<div class="shop-info"><h4>${sk.name}</h4><p>${sk.desc}</p></div><button class="buy-btn ${equipped ? 'sell-btn' : owned ? 'equip-btn' : ''}" type="button">${equipped ? 'مرتدى ✓' : owned ? 'ارتداء' : `شراء (${sk.price} د.ع)`}</button>`;
            row.querySelector('button').onclick = () => {
              if (!owned) {
                if (gameState.coins < sk.price) { showToast('رصيدك غير كافٍ!'); return; }
                gameState.coins -= sk.price;
                gameState.ownedSkins.push(sk.id);
              }
              gameState.currentSkin = sk.id;
              player.buildSkin(sk.id);
              updateHudStats(pigeons.filter((p) => p.state === 'FLYING').length);
              saveGameAuto();
              renderMarketTab('skins');
            };
            marketListEl.appendChild(row);
          });
        } else if (tab === 'coop') {
          const row = document.createElement('div');
          row.className = 'shop-item';
          row.innerHTML = `<div class="shop-info"><h4>أدوية وتقوية السرب</h4><p>ترفع نشاط السرب إلى 100%</p></div><button class="buy-btn sell-btn" type="button">شراء (55 د.ع)</button>`;
          row.querySelector('button').onclick = () => {
            if (gameState.coins < 55) { showToast('رصيدك غير كافٍ!'); return; }
            gameState.coins -= 55;
            gameState.flockHealth = 100;
            updateHudStats(pigeons.filter((p) => p.state === 'FLYING').length);
            saveGameAuto();
          };
          marketListEl.appendChild(row);
        }
      }

      document.getElementById('btn-market').addEventListener('click', () => { marketModal.style.display = 'flex'; renderMarketTab(currentMarketTab); });
      document.getElementById('btn-close-market').addEventListener('click', () => { marketModal.style.display = 'none'; });
      document.querySelectorAll('.tab-btn').forEach((b) => { b.addEventListener('click', () => renderMarketTab(b.dataset.tab)); });

      const lbModal = document.getElementById('leaderboard-modal');
      const lbList = document.getElementById('leaderboard-list');
      document.getElementById('btn-leaderboard').addEventListener('click', () => {
        lbList.innerHTML = '';
        const list = leaderboardData.length > 0
          ? leaderboardData
          : [{ name: `أنت (سطح #${mySlot})`, coins: Math.floor(gameState.coins), flyingCount: pigeons.filter((p) => p.state === 'FLYING').length }];
        list.forEach((item, idx) => {
          const r = document.createElement('div');
          r.className = 'shop-item';
          r.innerHTML = `<div class="shop-info"><h4>#${idx + 1} ${item.name}</h4><p>طائر بالسماء: ${item.flyingCount || 0}</p></div><div style="color:#facc15;font-weight:800;font-size:10px;">${item.coins} د.ع</div>`;
          lbList.appendChild(r);
        });
        lbModal.style.display = 'flex';
      });
      document.getElementById('btn-close-leaderboard').addEventListener('click', () => { lbModal.style.display = 'none'; });

      const chatInput = document.getElementById('online-chat-input');
      document.getElementById('online-chat-send').addEventListener('click', () => {
        const txt = chatInput.value.trim();
        if (!txt) return;
        if (wsClient && wsClient.readyState === WebSocket.OPEN) {
          wsClient.send(JSON.stringify({ type: 'CHAT_MSG', text: txt }));
        } else {
          appendChatMessage('أنت', txt, null);
        }
        chatInput.value = '';
      });

      let isFirstPerson = false;
      document.getElementById('btn-view').addEventListener('click', (e) => {
        isFirstPerson = !isFirstPerson;
        e.target.textContent = isFirstPerson ? 'منظور: أول' : 'منظور: ثالث';
        player.group.visible = !isFirstPerson;
      });

      // Multi-touch safe Joystick (independent touchIdentifier)
      const joyZone = document.getElementById('joystick-zone');
      const joyKnob = document.getElementById('joystick-knob');
      let joyTouchId = null;
      let joyX = 0;
      let joyY = 0;

      function updateJoyFromTouch(t) {
        const rect = joyZone.getBoundingClientRect();
        const maxR = 24;
        const dx = t.clientX - (rect.left + rect.width / 2);
        const dy = t.clientY - (rect.top + rect.height / 2);
        const clamped = Math.min(Math.hypot(dx, dy), maxR);
        const ang = Math.atan2(dy, dx);
        const kx = Math.cos(ang) * clamped;
        const ky = Math.sin(ang) * clamped;
        joyKnob.style.transform = `translate(${kx}px, ${ky}px)`;
        joyX = kx / maxR;
        joyY = ky / maxR;
      }

      joyZone.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (joyTouchId !== null) return;
        const t = e.changedTouches[0];
        if (!t) return;
        joyTouchId = t.identifier;
        updateJoyFromTouch(t);
      }, { passive: false });

      window.addEventListener('touchmove', (e) => {
        if (joyTouchId === null) return;
        for (let i = 0; i < e.touches.length; i++) {
          const t = e.touches[i];
          if (t.identifier === joyTouchId) {
            updateJoyFromTouch(t);
            break;
          }
        }
      }, { passive: false });

      function clearJoyTouch(e) {
        if (joyTouchId === null) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === joyTouchId) {
            joyTouchId = null;
            joyX = 0;
            joyY = 0;
            joyKnob.style.transform = 'translate(0px, 0px)';
            break;
          }
        }
      }
      window.addEventListener('touchend', clearJoyTouch);
      window.addEventListener('touchcancel', clearJoyTouch);

      // Multi-finger safe Camera Orbit on Canvas (independent pointerId)
      let camYaw = 0.0;
      let camPitch = 0.25;
      let camPointerId = null;
      let lastCamX = 0;
      let lastCamY = 0;

      canvas.addEventListener('pointerdown', (e) => {
        if (camPointerId !== null) return;
        camPointerId = e.pointerId;
        lastCamX = e.clientX;
        lastCamY = e.clientY;
      });

      window.addEventListener('pointermove', (e) => {
        if (e.pointerId !== camPointerId) return;
        camYaw -= (e.clientX - lastCamX) * 0.0065;
        camPitch = Math.max(-0.9, Math.min(1.1, camPitch + (e.clientY - lastCamY) * 0.0055));
        lastCamX = e.clientX;
        lastCamY = e.clientY;
      });

      function releaseCamPointer(e) {
        if (e.pointerId === camPointerId) camPointerId = null;
      }
      window.addEventListener('pointerup', releaseCamPointer);
      window.addEventListener('pointercancel', releaseCamPointer);

      const keys = {};
      window.addEventListener('keydown', (e) => {
        if (document.activeElement === renameInput || document.activeElement === chatInput) return;
        keys[e.code] = true;
        if (e.code === 'Space') player.jump();
      });
      window.addEventListener('keyup', (e) => { keys[e.code] = false; });

      window.addEventListener('resize', () => {
        camera.aspect = (window.innerWidth || 1280) / (window.innerHeight || 720);
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth || 1280, window.innerHeight || 720);
      });

      let prevTime = performance.now();
      let elapsed = 0;
      let hudSync = 0;
      let netSync = 0;
      let saveSync = 0;

      function animate(now) {
        requestAnimationFrame(animate);
        const dt = Math.min((now - prevTime) / 1000, 0.05);
        prevTime = now;
        elapsed += dt;

        if (myRoofParts.doorPivot) {
          myRoofParts.doorPivot.rotation.y += ((COOP.isOpen ? -Math.PI * 0.62 : 0) - myRoofParts.doorPivot.rotation.y) * Math.min(1, dt * 8);
        }

        if (gameState.activeFeedPile) {
          gameState.activeFeedPile.timer -= dt;
          if (gameState.activeFeedPile.timer <= 0) gameState.activeFeedPile = null;
        }
        if (gameState.activeWaterPile) {
          gameState.activeWaterPile.timer -= dt;
          if (gameState.activeWaterPile.timer <= 0) {
            waterSurface.visible = false;
            gameState.activeWaterPile = null;
          }
        }

        let moveForward = -joyY;
        let moveRight = joyX;
        if (keys['KeyW'] || keys['ArrowUp']) moveForward += 1;
        if (keys['KeyS'] || keys['ArrowDown']) moveForward -= 1;
        if (keys['KeyD'] || keys['ArrowRight']) moveRight += 1;
        if (keys['KeyA'] || keys['ArrowLeft']) moveRight -= 1;
        player.update(dt, moveForward, moveRight, camYaw);

        let flyingCount = 0;
        for (let i = 0; i < pigeons.length; i++) {
          pigeons[i].update(dt, elapsed, pigeons);
          if (pigeons[i].state === 'FLYING') flyingCount++;
        }

        if (isFirstPerson) {
          camera.position.set(player.group.position.x, player.group.position.y + 1.66, player.group.position.z);
          const horizLook = Math.cos(camPitch) * 12;
          const vertLook = -Math.sin(camPitch) * 12;
          camera.lookAt(
            player.group.position.x - Math.sin(camYaw) * horizLook,
            player.group.position.y + 1.66 + vertLook,
            player.group.position.z - Math.cos(camYaw) * horizLook
          );
        } else {
          const horiz = Math.cos(camPitch) * 6.2;
          const vert = Math.sin(camPitch) * 6.2 + 1.35;
          camera.position.lerp(
            new THREE.Vector3(
              player.group.position.x + Math.sin(camYaw) * horiz,
              Math.max(ROOF_Y + 0.35, player.group.position.y + vert),
              player.group.position.z + Math.cos(camYaw) * horiz
            ),
            Math.min(1, dt * 14)
          );
          camera.lookAt(player.group.position.x, player.group.position.y + 1.25, player.group.position.z);
        }

        hudSync += dt;
        if (hudSync >= 0.25) {
          hudSync = 0;
          updateHudStats(flyingCount);
        }

        netSync += dt;
        if (netSync >= 0.1) {
          netSync = 0;
          sendOnlineState(flyingCount);
        }

        saveSync += dt;
        if (saveSync >= 12) {
          saveSync = 0;
          saveGameAuto();
        }

        renderer.render(scene, camera);
      }

      updateHudStats(0);
      requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
